<!DOCTYPE html>
<!--
  Debatly — password reset bridge.

  Deploy to: https://debatly.app/reset-hasla   (must match
  AppConfig.passwordResetRedirectUrl and be allow-listed in Supabase under
  Authentication -> URL Configuration -> Redirect URLs).

  WHY THIS PAGE EXISTS
    The reset mail links to GoTrue's /verify, which redirects to whatever
    `redirect_to` says. Pointing that straight at `debatly://reset-password`
    works beautifully on the phone and is a dead end anywhere else: a desktop
    browser is handed a scheme it does not know and shows a protocol error, so
    somebody who reads mail on a laptop is stuck with no explanation. Our domain
    is never even reached, so no page could help.

    So the redirect lands HERE instead, and this page forwards into the app. On
    a phone that is an invisible extra hop (there was already one — the mail
    link is an https URL on Supabase). On a desktop it is a plain explanation
    instead of an error dialog.

  WHY IT CANNOT JUST FINISH THE RESET ITSELF
    The flow is PKCE: the `code_verifier` needed to redeem the code lives in the
    storage of the app install that ASKED for the reset. No web page — and no
    other device — can complete the exchange. The phone that requested it is the
    only place this can end.

  The `code` in the query string is a one-time auth credential. It is forwarded
  to the app and nowhere else: this page loads no scripts, fonts or images from
  anywhere, and makes no network requests of its own. Keep it that way.
-->
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reset hasła · Debatly</title>
<style>
  :root {
    --bg: #F6F6F9;
    --card: #FFFFFF;
    --border: #E2E2EA;
    --ink: #15161A;
    --muted: #5E5E66;
    --spark: #F97316;
    --warn-bg: #FFF7ED;
    --warn-border: #FDD9B5;
    --warn-ink: #7C4A17;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 12px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .card {
    max-width: 560px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  .head {
    background: #000;
    padding: 26px 32px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #fff;
  }
  .head span { color: var(--spark); }
  .body { padding: 32px; }
  h1 { margin: 0 0 12px; font-size: 21px; line-height: 28px; font-weight: 700; }
  p { margin: 0 0 20px; font-size: 15px; color: var(--muted); }
  .cta {
    display: inline-block;
    padding: 15px 30px;
    background: var(--spark);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 12px;
  }
  .note {
    margin: 24px 0 0;
    padding: 14px 16px;
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 12px;
    font-size: 13px;
    color: var(--warn-ink);
  }
  .note p { margin: 0; font-size: 13px; color: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">Debatly<span>.</span></div>
    <div class="body">
      <!-- Nothing is shown until the script decides which of the three states
           applies, so the page never flashes the wrong message. -->
      <div id="opening" hidden>
        <h1 data-pl="Otwieramy aplikację…" data-en="Opening the app…"></h1>
        <p data-pl="Za chwilę przeniesiemy Cię do Debatly, żebyś ustawił nowe hasło. Jeśli nic się nie dzieje, dotknij przycisku poniżej."
           data-en="We're taking you to Debatly to set a new password. If nothing happens, tap the button below."></p>
        <a id="open-cta" class="cta" href="#" data-pl="Otwórz w Debatly" data-en="Open in Debatly"></a>
      </div>

      <div id="desktop" hidden>
        <h1 data-pl="Dokończ na telefonie" data-en="Finish on your phone"></h1>
        <p data-pl="Ten link trzeba otworzyć na telefonie, na którym poprosiłeś o reset — tylko tam Debatly może dokończyć zmianę hasła. Otwórz tę wiadomość w skrzynce na telefonie i kliknij link jeszcze raz."
           data-en="This link has to be opened on the phone you requested the reset from — only there can Debatly finish the change. Open this email on your phone and tap the link again."></p>
        <div class="note">
          <p data-pl="Ze względów bezpieczeństwa klucz potrzebny do zmiany hasła zostaje na tym jednym telefonie i nigdy go nie opuszcza. Dlatego komputer ani inne urządzenie nie dokończy tego kroku."
             data-en="For security the key needed to change the password stays on that one phone and never leaves it. That's why a computer or another device can't complete this step."></p>
        </div>
      </div>

      <div id="expired" hidden>
        <h1 data-pl="Link wygasł" data-en="This link has expired"></h1>
        <p data-pl="Ten link do resetu wygasł albo został już użyty. Otwórz Debatly na telefonie, dotknij „Nie pamiętasz hasła?” i poproś o nowy."
           data-en="This reset link has expired or was already used. Open Debatly on your phone, tap “Forgot your password?” and request a new one."></p>
      </div>
    </div>
  </div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  // GoTrue reports failures on the redirect itself (expired / already-used
  // token), in the query string or the hash depending on the flow.
  var hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  var failed = params.get('error') || hash.get('error') ||
               params.get('error_code') || hash.get('error_code');
  var code = params.get('code');

  // Only real phones get the automatic hop. On a desktop, navigating to an
  // unknown scheme is precisely the protocol-error dialog this page exists to
  // avoid — so there it is never attempted.
  var isPhone = /android|iphone|ipad|ipod/i.test(navigator.userAgent);

  var lang = (navigator.language || 'pl').toLowerCase().slice(0, 2) === 'pl' ? 'pl' : 'en';
  document.documentElement.lang = lang;
  var nodes = document.querySelectorAll('[data-' + lang + ']');
  for (var i = 0; i < nodes.length; i++) {
    nodes[i].textContent = nodes[i].getAttribute('data-' + lang);
  }

  function show(id) { document.getElementById(id).hidden = false; }

  if (failed || !code) {
    show('expired');
    return;
  }

  // Forward the WHOLE query string, not just `code`: whatever else GoTrue
  // appended belongs to the app's exchange, and dropping it silently would be
  // hard to debug later.
  var deepLink = 'debatly://reset-password' + window.location.search;

  if (!isPhone) {
    show('desktop');
    return;
  }

  document.getElementById('open-cta').setAttribute('href', deepLink);
  show('opening');
  // `replace`, not `href`: the bridge should not sit in the back stack, so
  // going back from the app lands on the mail rather than on this page.
  window.location.replace(deepLink);
})();
</script>
</body>
</html>
