name: CI

# Runs the same gates a reviewer would: formatting, static analysis, and the
# full test suite. Triggered on every push to master and on every PR targeting
# it. Keep this green — it is the contract for "main is always shippable".
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel an in-flight run when a newer commit is pushed to the same ref, so the
# queue never piles up on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the toolchain in .metadata so CI matches local builds.
          # Bump this together with `flutter upgrade` locally.
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Fails if any file is not `dart format`-clean. Run `dart format .`
      # locally before pushing.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # Treat every analyzer hint as a hard failure — no warnings allowed to rot.
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests with coverage
        run: flutter test --coverage

      # Hard gate on line coverage so the suite can't silently rot. The floor is
      # set just below the coverage at the time it was introduced (46.59% →
      # floor 46) to leave a small buffer against incidental line-count churn.
      # Runs entirely in CI — no third-party upload — so it works on this
      # proprietary repo with zero external setup (no account, no token secret).
      #
      # IMPORTANT: only ever RAISE this floor. Do not lower `min_coverage`
      # without an explicit discussion — a dropping number is the signal we want
      # this gate to catch. The repo it lives in is archived/read-only, so the v3
      # tag is immutable.
      - name: Enforce coverage floor
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 46

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
